<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GEDCOM Graph</title>
    <link
      rel="stylesheet"
      href="https://code.getmdl.io/1.3.0/material.indigo-pink.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <script defer src="https://code.getmdl.io/1.3.0/material.min.js"></script>
		<style>
  body {
    margin: 0;
    font-family: "Helvetica", "Arial", sans-serif;
    overflow: hidden;
    height: 100vh;
  }

  #controls {
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 10;
    display: flex;
    align-items: center;
  }

  #treeView {
    position: absolute;
    top: 40px;
    left: 8px;
    width: 250px;
    height: 90vh;
    overflow-y: auto;
    background: #fff;
    border: 1px solid #ccc;
    z-index: 10;
    padding: 10px;
    display: none;
  }

  #toggleTreeView {
    display: none;
    position: absolute;
    top: 8px;
    left: 8px;
    z-index: 10;
    padding: 10px;
    cursor: pointer;
    background-color: #6200ea;
    color: white;
    border-radius: 4px;
    font-size: 16px;
    transition: background-color 0.3s;
  }

  #toggleTreeView:hover {
    background-color: #3700b3;
  }

  #gedcomFileLabel,
  #readMeButton {
    display: inline-block;
    padding: 10px 20px;
    font-size: 16px;
    background-color: #6200ea;
    color: white;
    border-radius: 4px;
    cursor: pointer;
    transition: background-color 0.3s;
    margin-left: 10px;
  }

  #gedcomFileLabel:hover,
  #readMeButton:hover {
    background-color: #3700b3;
  }

  #gedcomFile {
    display: none;
  }

  #searchBox {
    padding: 10px;
    font-size: 16px;
    margin-left: 20px;
    border-radius: 4px;
    border: 1px solid #ccc;
  }

  #mainLayout {
    display: flex;
    flex-direction: row;
    width: 100vw;
    height: 100vh;
  }

  #graphContainer {
    flex: 1;
    overflow: hidden;
    height: 100vh;
  }

  #modalContainer {
    width: 50vw;
    height: 100vh;
    overflow-y: auto;
    background: white;
    border-left: 2px solid #ccc;
    padding: 20px;
    box-sizing: border-box;
    position: relative;
    transition: all 0.3s ease;
		padding-bottom: 60px;
  }

  #modalContent {
    font-family: "Helvetica", "Arial", sans-serif;
  }

  svg {
    width: 100%;
    height: 100%;
    display: block;
    background-color: #f9f9f9;
  }

  .hidden {
    display: none;
  }

  ul {
    list-style-type: none;
    padding-left: 20px;
  }

  li {
    padding: 4px 0;
  }

  a {
    text-decoration: none;
    color: #6200ea;
    transition: color 0.3s;
  }

  a:hover {
    color: #3700b3;
  }

  .node.faded circle,
  .link.faded {
    opacity: 0.1;
  }

  .node circle,
  .link {
    transition: opacity 0.3s;
  }

  .link-tooltip {
    font-family: sans-serif;
    font-size: 14px;
    border-radius: 4px;
    box-shadow: 0 0 5px rgba(0, 0, 0, 0.1);
  }

  .modal-flex {
    display: flex;
    flex-direction: row;
    height: calc(100% - 40px); /* Leave space for close button */
    width: 100%;
  }

  .profile-pane {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    border-right: 1px solid #ccc;
  }

  .profile-pane:last-child {
    border-right: none;
  }

  .relation-header {
    text-align: center;
    font-weight: bold;
    padding: 10px;
    border-bottom: 1px solid #ccc;
  }
	
	#modalContainer button {
		  position: sticky;
		  bottom: 10px;
		  float: right;
		  margin: 18px;
		  background-color: #6200ea;
		  color: white;
		  padding: 15px;
		  border: none;
		  border-radius: 4px;
		  cursor: pointer;
		}

  /* 🔁 Responsive layout for mobile */
  @media (max-width: 768px) {
    #mainLayout {
      flex-direction: column;
    }

    #graphContainer {
      width: 100vw;
      height: 66vh;
    }

    #modalContainer {
      width: 100vw;
      height: 34vh;
      border-left: none;
      border-top: 2px solid #ccc;
      padding: 20px;
      overflow-y: auto;
      box-sizing: border-box;
      padding-bottom: 60px; /* for close button */
    }

    .modal-flex {
      flex-direction: column;
      height: auto;
    }

    .profile-pane {
      border-right: none;
      border-bottom: 1px solid #ccc;
    }

    .profile-pane:last-child {
      border-bottom: none;
    }

		#modalContainer button {
		  position: sticky;
		  bottom: 10px;
		  float: right;
		  margin: 18px;
		  background-color: #6200ea;
		  color: white;
		  padding: 15px;
		  border: none;
		  border-radius: 4px;
		  cursor: pointer;
		}
  }
</style>
  </head>
  <body>
    <div id="treeView"></div>
    <div id="toggleTreeView" onclick="toggleTree()">Show Files</div>

    <div id="controls">
      <a
        id="readMeButton"
        href="https://github.com/Juansero29/gedcom_character_map_graphs"
        target="_blank"
      >
        <i class="fab fa-github"></i> READ ME
      </a>
      <label for="gedcomFile" id="gedcomFileLabel">Choose Custom .GED</label>
      <input type="file" id="gedcomFile" />
      <input
        type="text"
        id="searchBox"
        placeholder="Search..."
        oninput="searchGraph()"
      />
    </div>

    <div id="mainLayout">
      <div id="graphContainer">
        <svg viewBox="-200 -200 800 800"></svg>
      </div>
			<div id="modalContainer" class="hidden">
  <div id="modalContent"></div>
  <button class="close-button" onclick="closeModal()">CLOSE</button>
</div>
    </div>

    <script src="https://d3js.org/d3.v6.min.js"></script>
    <script src="graph.js"></script>
  </body>
</html>
